    <script>
      const pyodideWorker = new Worker("./lem_panel.js");
      pyodideWorker.busy = false
      pyodideWorker.queue = []
      
      let patching = 0
      
      function send_change(jsdoc, event) {
        if ((event.setter_id != null && event.setter_id == 'py') || (patching > 0)) {
          return
        } else if (pyodideWorker.busy && event.model && event.attr) {
          let events = []
          for (const old_event of pyodideWorker.queue) {
            if (!(old_event.model === event.model && old_event.attr === event.attr)) {
              events.push(old_event)
            }
          }
          events.push(event)
          pyodideWorker.queue = events
          return
        }
        const patch = jsdoc.create_json_patch([event])
        pyodideWorker.busy = true
        pyodideWorker.postMessage({type: 'patch', patch: patch})
      }
      
      pyodideWorker.onmessage = async (event) => {
        const msg = event.data
      
        const body = document.getElementsByTagName('body')[0]
        const loading_msgs = document.getElementsByClassName('pn-loading-msg')
        if (msg.type === 'idle') {
          if (pyodideWorker.queue.length) {
            const patch = pyodideWorker.jsdoc.create_json_patch(pyodideWorker.queue)
            pyodideWorker.busy = true
            pyodideWorker.queue = []
            pyodideWorker.postMessage({type: 'patch', patch: patch})
          } else {
            pyodideWorker.busy = false
          }
        } else if (msg.type === 'status') {
          let loading_msg
          if (loading_msgs.length) {
            loading_msg = loading_msgs[0]
          } else if (body.classList.contains('pn-loading')) {
            loading_msg = document.createElement('div')
            loading_msg.classList.add('pn-loading-msg')
            body.appendChild(loading_msg)
          }
          if (loading_msg != null) {
            loading_msg.innerHTML = msg.msg
          }
        } else if (msg.type === 'render') {
          const docs_json = JSON.parse(msg.docs_json)
          const render_items = JSON.parse(msg.render_items)
          const root_ids = JSON.parse(msg.root_ids)
      
          // Remap roots in message to element IDs
          const root_els = document.querySelectorAll('[data-root-id]')
          const data_roots = []
          for (const el of root_els) {
             el.innerHTML = ''
             data_roots.push([el.getAttribute('data-root-id'), el.id])
          }
          data_roots.sort((a, b) => a[0]<b[0] ? -1: 1)
          const roots = {}
          for (let i=0; i<data_roots.length; i++) {
            roots[root_ids[i]] = data_roots[i][1]
          }
          render_items[0]['roots'] = roots
          render_items[0]['root_ids'] = root_ids
      
          // Clear pre-rendered contents
          Bokeh.index.roots.map((v) => v.remove())
      
          // Embed content
          const [views] = await Bokeh.embed.embed_items(docs_json, render_items)
      
          // Remove loading spinner and message
          body.classList.remove("pn-loading", "arc")
          for (const loading_msg of loading_msgs) {
            loading_msg.remove()
          }
      
          // Setup bi-directional syncing
          pyodideWorker.jsdoc = jsdoc = [...views.roots.values()][0].model.document
          jsdoc.on_change(send_change.bind(null, jsdoc), false)
          pyodideWorker.postMessage({'type': 'rendered'})
          pyodideWorker.postMessage({'type': 'location', location: JSON.stringify(window.location)})
        } else if (msg.type === 'patch') {
          try {
            patching += 1
            pyodideWorker.jsdoc.apply_json_patch(msg.patch, msg.buffers)
          } finally {
            patching -= 1
          }
        }
      };
    </script>

fore {\n  background-color: #c3c3c3;\n  width: calc(min(40px, 300px));\n  height: calc(min(40px, 300px));\n  mask-size: calc(min(40px, 300px)) calc(min(40px, 300px));\n  -webkit-mask-size: calc(min(40px, 300px)) calc(min(40px, 300px));\n}",{"id":"p1283"},{"id":"p1284"},{"id":"p1281"},{"id":"p1282"}],"margin":[5,10],"align":"start","text":"&amp;lt;p&amp;gt;The open circle is the channel\u2013hillslope transition: the first point down the stream where the surface is not convex (\u2207\u00b2&amp;lt;em&amp;gt;z&amp;lt;/em&amp;gt; \u2265 0). The line \u201cchannel\u2013hillslope transition\u201d is \u2207\u00b2&amp;lt;em&amp;gt;z&amp;lt;/em&amp;gt; = 0 over the whole map. The \u201cridgelines\u201d are the ridges between the streams that drain at least 0.04 km\u00b2. A channel starts where 1600 m\u00b2 drain to it, and no higher than its transition. The channels can be colored by their Strahler order, by their steepness, &amp;lt;em&amp;gt;k&amp;lt;/em&amp;gt;&amp;lt;sub&amp;gt;sn&amp;lt;/sub&amp;gt; = &amp;lt;em&amp;gt;S&amp;lt;/em&amp;gt; &amp;lt;em&amp;gt;A&amp;lt;/em&amp;gt;&amp;lt;sup&amp;gt;0.5&amp;lt;/sup&amp;gt; on each link, or by \u03c7, the sum of (&amp;lt;em&amp;gt;A&amp;lt;/em&amp;gt;&amp;lt;sub&amp;gt;0&amp;lt;/sub&amp;gt;/&amp;lt;em&amp;gt;A&amp;lt;/em&amp;gt;)&amp;lt;sup&amp;gt;0.5&amp;lt;/sup&amp;gt; times distance up the channel from the edge of the block; a halo then marks the chosen stream, and with &amp;lt;em&amp;gt;k&amp;lt;/em&amp;gt;&amp;lt;sub&amp;gt;sn&amp;lt;/sub&amp;gt; its points on the slope\u2013area plot take the same colors from the transition down. The drainage density is the length of the channels over the area of the block. \u201cFit\u201d draws &amp;lt;em&amp;gt;S&amp;lt;/em&amp;gt; = &amp;lt;em&amp;gt;k&amp;lt;/em&amp;gt;&amp;lt;sub&amp;gt;s&amp;lt;/sub&amp;gt; &amp;lt;em&amp;gt;A&amp;lt;/em&amp;gt;&amp;lt;sup&amp;gt;\u2212\u03b8&amp;lt;/sup&amp;gt; through the chosen stream from its transition down, with both free (&amp;lt;em&amp;gt;k&amp;lt;/em&amp;gt;&amp;lt;sub&amp;gt;s&amp;lt;/sub&amp;gt; is in m&amp;lt;sup&amp;gt;2\u03b8&amp;lt;/sup&amp;gt;), and gives &amp;lt;em&amp;gt;k&amp;lt;/em&amp;gt;&amp;lt;sub&amp;gt;sn&amp;lt;/sub&amp;gt; with \u03b8 held at 0.5.&amp;lt;/p&amp;gt;\n"}},{"type":"object","name":"Row","id":"p1317","attributes":{"name":"Row00136","stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  width: calc(min(40px, 300px));\n  height: calc(min(40px, 300px));\n  mask-size: calc(min(40px, 300px)) calc(min(40px, 300px));\n  -webkit-mask-size: calc(min(40px, 300px)) calc(min(40px, 300px));\n}",{"id":"p1283"},{"id":"p1293"},{"id":"p1281"},{"id":"p1282"}],"min_width":80,"margin":0,"sizing_mode":"stretch_width","align":"start","children":[{"type":"object","name":"panel.models.markup.HTML","id":"p1318","attributes":{"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  width: calc(min(40px, 300px));\n  height: calc(min(40px, 300px));\n  mask-size: calc(min(40px, 300px)) calc(min(40px, 300px));\n  -webkit-mask-size: calc(min(40px, 300px)) calc(min(40px, 300px));\n}",{"id":"p1283"},{"id":"p1281"},{"id":"p1282"}],"width":80,"height":80,"margin":[5,10],"sizing_mode":"fixed","align":"start","text":"&amp;lt;a href=&amp;quot;https://landlab.csdms.io&amp;quot; target=&amp;quot;_blank&amp;quot;&amp;gt;&amp;lt;img src=&amp;quot;data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAYAAABS3GwHAAABhGlDQ1BJQ0MgUHJvZmlsZQAAeJx9kT1Iw0AcxV8/xCIVB4uIKGSoThZERXTTKhShQqgVWnUwufQLmjQkKS6OgmvBwY/FqoOLs64OroIg+AHi6OSk6CIl/i8ptIjx4Lgf7+497t4B/nqZqWZwDFA1y0gl4kImuyp0viKEIfQhiBmJmfqcKCbhOb7u4ePrXYxneZ/7c3QrOZMBPoF4lumGRbxBPLVp6Zz3iSOsKCnE58SjBl2Q+JHrsstvnAsO+3lmxEin5okjxEKhjeU2ZkVDJZ4kjiqqRvn+jMsK5y3OarnKmvfkLwzntJVlrtMcRAKLWIIIATKqKKEMCzFaNVJMpGg/7uEfcPwiuWRylcDIsYAKVEiOH/wPfndr5ifG3aRwHOh4se2PYaBzF2jUbPv72LYbJ0DgGbjSWv5KHZj+JL3W0qJHQM82cHHd0uQ94HIH6H/SJUNypABNfz4PvJ/RN2WB3luga83trbmP0wcgTV0lb4CDQ2CkQNnrHu8Otff275lmfz+bE
